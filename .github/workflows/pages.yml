name: Deploy site to Pages

on:
  push:
    branches: [claude/perpetual-fractal-loop-qq5rrp, claude/travel-time-estimator-affd2e]
    paths: [index.html, travel.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No environment block here on purpose. The auto-created github-pages
    # environment has a branch rule that blocks every current branch, and
    # the deploy action works without declaring it.
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
